                                                <div className="col-span-full py-8 text-center bg-white dark:bg-slate-800 rounded-xl border border-dashed border-slate-300 dark:border-slate-600">
                                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">No projects in Belum SDHO status</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        <div className="dashboard-card">
                                            <div className="flex items-center justify-between mb-6">
                                                <h3 className="dashboard-title mb-0">Top 10 Projects by Value</h3>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-trophy text-amber-400"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></svg>
                                            </div>
                                            <div className="space-y-4">
                                                {dashboardData?.topProjectsByValue.map((p, i) => (
                                                    <button key={p.id} onClick={() => handleProjectClick(p.id)} className="w-full space-y-1 text-left group">
                                                        <div className="flex justify-between text-xs font-bold">
                                                            <span className="truncate pr-4 group-hover:text-indigo-600 flex items-center gap-2">
                                                                <span className="text-[10px] text-slate-300">#{i + 1}</span> {p.projName}
                                                            </span>
                                                            <span className="text-indigo-600">{formatShortCurrency(p.value)}</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                                            <div className="bg-indigo-500 h-full rounded-full transition-all duration-500" style={{ width: `${(p.value / (dashboardData.topProjectsByValue[0]?.value || 1)) * 100}%` }}></div>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="dashboard-card">
                                            <div className="flex items-center justify-between mb-6">
                                                <h3 className="dashboard-title mb-0">Top 10 Projects by Mandays</h3>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-banknote text-emerald-400"><rect width="20" height="12" x="2" y="6" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" /></svg>
                                            </div>
                                            <div className="space-y-4">
                                                {dashboardData?.topProjectsByMandays.map((p, i) => (
                                                    <button key={p.id} onClick={() => handleProjectClick(p.id)} className="w-full space-y-1 text-left group">
                                                        <div className="flex justify-between text-xs font-bold">
                                                            <span className="truncate pr-4 group-hover:text-indigo-600 flex items-center gap-2">
                                                                <span className="text-[10px] text-slate-300">#{i + 1}</span> {p.projName}
                                                            </span>
                                                            <span className="text-emerald-600">{formatShortCurrency(p.sisaMandays)}</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                                            <div className="bg-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${(p.sisaMandays / (dashboardData.topProjectsByMandays[0]?.sisaMandays || 1)) * 100}%` }}></div>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="dashboard-card">
                                            <div className="flex items-center justify-between mb-6">
                                                <h3 className="dashboard-title mb-0">PM Workload (Active Projects)</h3>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-user-check text-slate-300"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><polyline points="16 11 18 13 22 9" /></svg>
                                            </div>
                                            <div className="space-y-4">
                                                {dashboardData?.topPMs.map(([pm, count], i) => (
                                                    <button key={pm} onClick={() => handlePMClick(pm)} className="w-full space-y-1 text-left group">
                                                        <div className="flex justify-between text-xs font-bold">
                                                            <span className="truncate pr-4 group-hover:text-indigo-600 flex items-center gap-2">
                                                                <span className="text-[10px] text-slate-300">#{i + 1}</span> {pm}
                                                            </span>
                                                            <span className="text-indigo-600">{count} Projects</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                                                            <div className="bg-blue-500 h-full rounded-full transition-all duration-500" style={{ width: `${(count / (dashboardData.topPMs[0]?.[1] || 1)) * 100}%` }}></div>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="dashboard-card">
                                            <div className="flex items-center justify-between mb-6">
                                                <h3 className="dashboard-title mb-0">Top 10 Customers (By Total Value)</h3>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-users text-slate-300"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>
                                            </div>
                                            <div className="space-y-4">
                                                {dashboardData?.topCustomers.map(([cust, val], i) => (
                                                    <button key={cust} onClick={() => handleCustomerClick(cust)} className="w-full space-y-1 text-left group">
                                                        <div className="flex justify-between text-xs font-bold">
                                                            <span className="truncate pr-4 group-hover:text-indigo-600 flex items-center gap-2">
                                                                <span className="text-[10px] text-slate-300">#{i + 1}</span> {cust}
                                                            </span>
                                                            <span className="text-indigo-600">{formatShortCurrency(val)}</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                                                            <div className="bg-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${(val / (dashboardData.topCustomers[0]?.[1] || 1)) * 100}%` }}></div>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                        {isModalOpen && (
                            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                                <div className="bg-white dark:bg-slate-800 dark:bg-slate-800 p-8 rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl relative">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-black text-slate-800 dark:text-slate-100 tracking-tight">{editingProject ? 'Edit Project' : 'New Project'}</h2>
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 dark:text-slate-300">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                                        </button>
                                    </div>
                                    {formSubmitError && (
                                        <div className="mb-6 p-4 rounded-2xl bg-red-50 border border-red-100 text-red-700 text-sm font-bold flex items-start gap-3" role="alert">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0 text-red-500 mt-0.5" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>
                                            <span>{formSubmitError}</span>
                                        </div>
                                    )}
                                    <form onSubmit={handleSubmit} className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="md:col-span-2">
                                                <FormInput label="Project Name" value={formData.projName} onChange={v => setFormData({ ...formData, projName: v })} required placeholder="Enter project title..." disabled={!isAdmin} />
                                            </div>
                                            <FormInput label="Project Number" value={formData.projNumber} onChange={v => setFormData({ ...formData, projNumber: v })} required placeholder="PRJ-202X-XXX" disabled={!isAdmin} />
                                            <FormInput label="Customer" value={formData.customer} onChange={v => setFormData({ ...formData, customer: v })} required placeholder="Client name..." disabled={!isAdmin} />
                                            <FormInput label="PM" value={formData.pm} onChange={v => setFormData({ ...formData, pm: v })} placeholder="Lead PM..." disabled={!isAdmin} />
                                            <FormInput label="Status" value={formData.status} onChange={v => setFormData({ ...formData, status: v })} options={['Ongoing', 'Maintenance', 'Done', 'Belum SDHO']} disabled={!isAdmin} />
                                            <FormInput
                                                label="Methodology"
                                                value={formData.methodology || 'BAST Only'}
                                                onChange={v => setFormData({ ...formData, methodology: v })}
                                                options={['BAST Only', 'Simple', 'Complex']}
                                                disabled={!isAdmin}
                                                action={isAdmin && formData.files?.mom_text && (
                                                    <button
                                                        type="button"
                                                        onClick={async () => {
                                                            try {
                                                                showToast('info', 'Reading methodology from MOM…', 0);
                                                                const inferred = await inferMethodologyFromText(formData.files.mom_text);
                                                                if (inferred) {
                                                                    setFormData(prev => ({ ...prev, methodology: inferred }));
                                                                    showToast('success', `Methodology updated to: ${inferred}`, 6500);
                                                                } else {
                                                                    showToast('info', 'Could not identify methodology from this MOM text.', 6000);
                                                                }
                                                            } catch (err) {
                                                                console.error(err);
                                                                showToast('error', 'Fetch from MOM failed: ' + (err.message || String(err)), 8000);
                                                            }
                                                        }}
                                                        className="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 bg-indigo-50 px-2 py-0.5 rounded-lg border border-indigo-100 mb-1"
                                                    >
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-sparkles"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><path d="M5 3v4" /><path d="M19 17v4" /><path d="M3 5h4" /><path d="M17 19h4" /></svg>
                                                        Fetch from MOM
                                                    </button>
                                                )}
                                            />
                                            <FormInput label="Subcon" value={formData.subcon} onChange={v => setFormData({ ...formData, subcon: v })} placeholder="Partner..." disabled={!isAdmin} />
                                            <FormInput label="Value (Rp)" type="text" value={formatNumberWithCommas(formData.value)} onChange={v => setFormData({ ...formData, value: parseFormattedNumber(v) })} required disabled={!isAdmin} />
                                            <FormInput label="Mandays (Rp)" type="text" value={formatNumberWithCommas(formData.sisaMandays)} onChange={v => setFormData({ ...formData, sisaMandays: parseFormattedNumber(v) })} required disabled={!isAdmin} />
                                            <FormInput label="Start Date" type="date" value={formData.start} onChange={v => setFormData({ ...formData, start: v })} required disabled={!isAdmin} />
                                            <FormInput label="End Date" type="date" value={formData.end} onChange={v => setFormData({ ...formData, end: v })} disabled={!isAdmin} />
                                            <div className="md:col-span-2">
                                                <FormInput label="Solution" value={formData.solusi} onChange={v => setFormData({ ...formData, solusi: v })} placeholder="Technical approach..." disabled={!isAdmin} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1 mb-1.5 block">Project Notes & Remarks</label>
                                                <textarea 
                                                    disabled={!isAdmin} 
                                                    className="w-full h-32 px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all font-semibold text-slate-700 dark:text-slate-200 text-sm disabled:opacity-75 shadow-inner placeholder:text-slate-400 dark:placeholder:text-slate-600" 
                                                    value={formData.note} 
                                                    onChange={e => setFormData({ ...formData, note: e.target.value })} 
                                                    placeholder="Document current progress, critical blockers, or important updates here..."
                                                ></textarea>
                                            </div>

                                            <div className="md:col-span-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                                                <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">Project Attachments</label>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                                    {['sdho', 'mom', 'kickoff', 'report'].map(key => (
                                                        <FileDropZone
                                                            key={key}
                                                            label={key === 'mom' ? 'MOM SDHO' : key === 'report' ? 'Progress Report' : key.toUpperCase()}
                                                            fileUrl={formData.files?.[key]}
                                                            onUpload={isAdmin ? ((file) => handleAttachmentUpload(key, file)) : null}
                                                            onDelete={isAdmin ? (() => setFormData(p => ({ ...p, files: { ...p.files, [key]: '' } }))) : null}
                                                        />
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex gap-4 pt-6">
                                            <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 h-12 rounded-xl font-bold text-slate-400 dark:text-slate-500 border-2 border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 dark:bg-transparent transition-colors">Discard</button>
                                            {isAdmin && (
                                                <button type="submit" className="flex-1 h-12 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-500/30 transition-all active:scale-95">
                                                    {editingProject ? 'Update Project' : 'Launch Project'}
                                                </button>
                                            )}
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {saveSuccessModal && (
                            <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="save-success-title">
                                <div className="bg-white dark:bg-slate-800 dark:bg-slate-800 rounded-3xl w-full max-w-md shadow-2xl p-8 text-center relative">
                                    <button type="button" onClick={() => setSaveSuccessModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:text-slate-300 p-1 rounded-lg" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                                    </button>
                                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-5">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
                                    </div>
                                    <h3 id="save-success-title" className="text-xl font-black text-slate-800 dark:text-slate-100 tracking-tight mb-2">
                                        {saveSuccessModal === 'updated' ? 'Project updated' : 'Project created'}
                                    </h3>
                                    <p className="text-sm font-medium text-slate-500 dark:text-slate-400 mb-8">
                                        {saveSuccessModal === 'updated' ? 'Your changes have been saved to the database.' : 'The new project has been saved to the database.'}
                                    </p>
                                    <button type="button" onClick={() => setSaveSuccessModal(null)} className="w-full h-12 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100 active:scale-[0.98]">
                                        OK
                                    </button>
                                </div>
                            </div>
                        )}

                        {toast && (
                            <div
                                className={`fixed bottom-6 left-1/2 z-[70] w-[calc(100%-2rem)] max-w-lg -translate-x-1/2 rounded-2xl border shadow-xl px-4 py-3 flex items-start gap-3 animate-in fade-in slide-in-from-bottom-2 duration-200 ${toast.variant === 'error' ? 'bg-red-50 border-red-200 text-red-900' : toast.variant === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-950' : 'bg-slate-900 border-slate-700 text-white'}`}
                                role="status"
                            >
                                <p className="text-sm font-bold leading-snug flex-1 pt-0.5">{toast.message}</p>
                                <button type="button" onClick={clearToast} className={`shrink-0 rounded-lg p-1.5 font-bold text-xs uppercase tracking-wide ${toast.variant === 'error' ? 'text-red-600 hover:bg-red-100' : toast.variant === 'success' ? 'text-emerald-700 hover:bg-emerald-100/80' : 'text-slate-300 hover:bg-slate-800'}`} aria-label="Dismiss notification">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                                </button>
                            </div>
                        )}

                        <style>{`
                .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; background-color: #4f46e5; color: white; font-weight: 700; border-radius: 0.75rem; transition: all 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
                .btn-primary:hover { background-color: #4338ca; }
                .btn-primary:active { transform: scale(0.95); }
                .btn-secondary { display: inline-flex; align-items: center; gap: 0.5rem; background-color: white; border: 1px solid #e2e8f0; color: #334155; font-weight: 700; border-radius: 0.75rem; transition: all 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
                .btn-secondary:hover { background-color: #f8fafc; }
                .dark .btn-secondary { background-color: #0f172a; border-color: #334155; color: #e2e8f0; }
                .dark .btn-secondary:hover { background-color: #1e293b; }
                .filter-label { display: block; font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.375rem; margin-left: 0.25rem; }
                .filter-input { width: 100%; height: 2.5rem; padding: 0 0.75rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; outline: none; font-size: 0.75rem; font-weight: 700; color: #334155; transition: all 0.15s; appearance: auto; }
                .filter-input:focus { box-shadow: 0 0 0 2px #6366f1; border-color: #6366f1; }
                .dark .filter-input { background-color: #0f172a; border-color: #334155; color: #e2e8f0; }
                .dark .filter-input:focus { box-shadow: 0 0 0 2px #6366f1; }
                .dark .filter-input option { background-color: #1e293b; color: #e2e8f0; }
                .dashboard-card { background-color: white; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; transition: box-shadow 0.15s; display: flex; flex-direction: column; }
                .dashboard-card:hover { box-shadow: 0 4px 6px rgba(0,0,0,0.07); }
                .dark .dashboard-card { background-color: #1e293b; border-color: #334155; }
                .dashboard-title { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
                .prose { max-width: 100%; font-size: 0.75rem; }
                .prose table { width: 100%; border-collapse: collapse; margin: 8px 0; }
                .prose th, .prose td { border: 1px solid #e2e8f0; padding: 4px 8px; text-align: left; }
                .dark .prose th, .dark .prose td { border-color: #334155; }
                .prose th { background: #f8fafc; }
                .dark .prose th { background: #1e293b; }
                
                .custom-scrollbar::-webkit-scrollbar {
                    width: 4px;
                }
                .custom-scrollbar::-webkit-scrollbar-track {
                    background: transparent;
                }
                .custom-scrollbar::-webkit-scrollbar-thumb {
                    background-color: #e2e8f0;
                    border-radius: 9999px;
                }
                .dark .custom-scrollbar::-webkit-scrollbar-thumb {
                    background-color: #334155;
                }
                .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                    background-color: #cbd5e1;
                }
                .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                    background-color: #475569;
                }
              `}</style>
                    </div >
                );
            };

            const root = createRoot(document.getElementById('root'));
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );
        }; // End mountApp

        if (window.firebaseModular) {
            mountApp();
        } else {
            window.addEventListener('firebase-ready', mountApp);
            // Fallback safety
            setTimeout(() => { if (!window.firebaseModular) console.log("Waiting for Firebase..."); }, 500);
        }
    </script>
</body>

</html>
